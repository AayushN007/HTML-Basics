<!DOCTYPE html>
<html>
<head>
  <title>Forms</title>
</head>
<body><center>

  <fieldset>
    <legend>Login Form</legend>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email"><br><br>

    <label>Password:</label><br>
    <input type="password" placeholder="Enter your password"><br><br>

    <input type="submit" value="Login">
  </fieldset>

  <br><br>

  <fieldset>
    <legend>Registration Form</legend>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter full name"><br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter email"><br><br>

    <label>Password:</label><br>
    <input type="password" placeholder="Enter password"><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" placeholder="Confirm password"><br><br>

    <input type="submit" value="Register">
  </fieldset>

  <br><br>

  <fieldset>
    <legend>Forgot Password</legend>

    <label>Enter your email:</label><br>
    <input type="email" placeholder="Enter registered email"><br><br>

    <label>Enter your phone:</label><br>
    <input type="tel" placeholder="Enter registered phone"><br><br>

    <label>Enter your new password:</label><br>
    <input type="password" placeholder="Enter new password"><br><br>

    <label>Confirm password:</label><br>
    <input type="password" placeholder="Confirm password"><br><br>

    <input type="submit" value="Reset Password">
  </fieldset>

  <br><br>

  <fieldset>
    <legend>Contact Us</legend>

    <label>Name:</label><br>
    <input type="text" placeholder="Enter your name"><br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email"><br><br>

    <label>Message:</label><br>
    <textarea placeholder="Enter your message"></textarea><br><br>

    <input type="submit" value="Submit">
  </fieldset>
</center>
</body>
</html>
