<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><center>Registration</center></h1>
    <fieldset>
        <legend>
            Registration Form
        </legend>
        <label>Email: </label>
        <br><br>
        <input type=" email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label>Age: </label>
        <br><br>
        <input type="number" name="age" placeholder="Enter your age"  required min="18" max="60">
        <br><br>
        <label>Password: </label>
        <br><br>
        <input type="password" name="password" placeholder="Enter your password" required uppercase lowercase number specialchar>
        <br><br>
        <button>Register</button>
        <br><br>
    </fieldset>
</body> 
</html>
